source = ~/.config/hypr/wallust-colors.conf


general {
    ignore_empty_input = true
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = $color0 
    inner_color = $color0
    font_color =$color7
    fade_on_empty = true
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i>Input Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34) # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    fail_transition = 100 # transition time in ms between normal outer_color and fail_color
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = $color7 
    font_size = 55
    font_family = Fira Semibold
    position = -100, 40
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    text = Hello
    color = $color7
    font_size = 20
    font_family = Fira Semibold
    position = -100, 160
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

image {
    monitor =
    path = ~/.config/assets/backgrounds/cat_pacman.png
    size = 280 # lesser side if not 1:1 ratio
    rounding = -1 # negative values mean circle
    border_size = 4
    border_color = $color6 
    rotate = 0 # degrees, counter-clockwise
    reload_time = -1 # seconds between reloading, 0 to reload with SIGUSR2
#    reload_cmd = blur_passes = 3 blur_size = 8 # command to get new path. if empty, old path will be used. don't run "follow" commands like tail -F
    position = 0, 200
    halign = center
    valign = center
}
# Music blur div
# Music card background

shape {
    monitor =
    size = 440, 110
    color = $color0aa
    rounding = 20
    rotate = 0
    position = 30, -310
    halign = center
    valign = center
    zindex = 1
}


# Album art
image {
    path = /tmp/hyprlock-art.png 
    size = 70
    keep_aspect_ratio = true
    rounding = 12
    position = -130, -310
    halign = center
    valign = center
    reload_time = 2
    zindex = 5
}
label {
    monitor =
    text = cmd[update:1000] sh -c 'playerctl metadata title 2>/dev/null | awk "{ if(length(\$0)>18) print substr(\$0,1,18)\"...\"; else print }"'
    color = $color7
    font_size = 13
    font_family = Fira Semibold
    position = 910, -310
    halign = left
    valign = center
    zindex = 5
}

# Artist
label {
    monitor =
    text = cmd[update:1000] sh -c 'playerctl metadata artist 2>/dev/null'
    color = $color6
    font_size = 11
    font_family = Fira Semibold
    position = 910, -330
    halign = left
    valign = center
    zindex = 5
}

# Player source
label {-30, -320
    monitor =
    text = cmd[update:2000] playerctl -l | head -n1
    color = $color5
    font_size = 10
    font_family = Fira Semibold
    position = -910, -332
    halign = left
    valign = center
    zindex = 5
}

# Duration
label {
    monitor =
    text = cmd[update:1000] sh -c 'playerctl position 2>/dev/null | awk "{printf \"%d:%02d\", \$1/60, \$1%60}"'
    color = $color7
    font_size = 11
    font_family = Fira Semibold
    position = 220, -300
    halign = center
    valign = center
    zindex = 5
}

# Status dot
label {
    monitor =
    text = cmd[update:1000] sh -c 'playerctl status 2>/dev/null | sed "s/Playing/●/;s/Paused/⏸/;s/Stopped/■/"'
    color = $color2
    font_size = 12
    position = 190, -300
    halign = center
    valign = center
    zindex = 5
}
